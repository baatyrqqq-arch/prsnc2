<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:12px 16px 110px}
h1{font-size:1.4rem;margin:8px 0 2px}h2{font-size:1.05rem;margin:0}p{margin:0}.mute{color:var(--mute);font-size:.9rem}
.top{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.lang{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;min-height:40px;padding:0 12px;font-weight:700;cursor:pointer}
.back{background:none;border:0;color:var(--brand);font:600 1rem inherit;padding:10px 4px;cursor:pointer}
button,input{font-family:inherit}
.btn{width:100%;min-height:52px;border-radius:10px;border:2px solid var(--brand);background:var(--brand);color:var(--on);font-weight:700;font-size:1.05rem;cursor:pointer}
.btn.sec{background:transparent;color:var(--brand)}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.lesson{display:block;width:100%;text-align:left;padding:14px;margin-top:10px;color:inherit;font-size:1rem}
button.lesson{cursor:pointer}
.lesson.off{opacity:.75}
.lrow{display:flex;justify-content:space-between;gap:8px;align-items:center}
.st{padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:700;white-space:nowrap;border:1px solid var(--line);color:var(--mute)}
.st.act{background:var(--okbg);color:var(--ok);border-color:var(--ok)}.st.sent{background:var(--latebg);color:var(--late);border-color:var(--late)}
.chips{display:flex;gap:8px;margin:12px 0}
.chip{flex:1;padding:8px;border-radius:10px;text-align:center;font-weight:700}.chip small{display:block;font-weight:400}
.ok{background:var(--okbg);color:var(--ok)}.late{background:var(--latebg);color:var(--late)}.abs{background:var(--absbg);color:var(--abs)}
.alert{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px;border-radius:12px;background:var(--latebg);color:var(--late);border:1px solid var(--late);margin-bottom:12px}
.alert button{min-height:44px;padding:0 14px;border-radius:8px;border:2px solid var(--late);background:transparent;color:var(--late);font-weight:700;cursor:pointer}
.hint{padding:14px;margin-top:12px;border-left:4px solid var(--brand)}
.hint ol{margin:8px 0 12px;padding-left:20px}.hint li{margin:2px 0}
.hint button{min-height:44px;padding:0 16px;border-radius:8px;border:2px solid var(--brand);background:transparent;color:var(--brand);font-weight:700;cursor:pointer}
.tools{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.search{width:100%;min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 12px;font-size:1rem}
.filters{display:flex;gap:6px;overflow-x:auto}
.f{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;cursor:pointer;white-space:nowrap}
.f[aria-pressed=true]{background:var(--brand);color:var(--on);border-color:var(--brand)}
.row{display:flex;align-items:center;width:100%;gap:10px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;text-align:left;font-size:1rem;cursor:pointer;min-height:56px}
.row:last-child{border-bottom:0}
.empty{padding:20px;text-align:center}
.av{width:36px;height:36px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-weight:700;font-size:.8rem;flex:none}
.grow{flex:1}.tag{padding:4px 10px;border-radius:999px;font-weight:700;font-size:.85rem;white-space:nowrap}
.src{font-size:.85rem;color:var(--mute)}.src.t{color:var(--brand);font-weight:600}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:18px 16px;max-height:88%;overflow:auto}

.opt:disabled{opacity:.55;cursor:default}

.snap{display:block;width:100%;border-radius:10px;margin:10px 0}

.toast button{background:none;border:0;color:var(--bg);font-weight:700;text-decoration:underline;cursor:pointer;min-height:44px}

.big{font-size:3rem;text-align:center;margin-top:40px;color:var(--ok)}
.sum{padding:14px;margin:14px 0}
.hero{padding:16px;margin-top:12px;border-left:4px solid var(--brand)}.hero h2{margin:2px 0 4px}.hero .btn{margin-top:12px}.big{font-size:1.6rem;font-weight:800;margin:6px 0}
.authf{display:flex;flex-direction:column;gap:12px}.authf label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.9rem}
.who{margin-left:auto;margin-right:8px;display:flex;align-items:center;gap:4px;font-size:.85rem;color:var(--mute)}
.err{color:var(--abs);font-weight:600;min-height:1.2em}.demo{display:flex;gap:8px;flex-wrap:wrap}.demo .opt{margin:0;flex:1}
</style>
<style id="product-upgrades">
:root{color-scheme:light dark}
html{scroll-behavior:smooth}
body{transition:background .25s,color .25s}
main{max-width:1180px;padding:20px 24px 120px;animation:screenIn .22s ease}
@keyframes screenIn{from{opacity:.55;transform:translateY(5px)}to{opacity:1;transform:none}}
.card,.row,.btn,.f,.opt{transition:background .18s,border-color .18s,transform .18s,box-shadow .18s}
button:hover{filter:brightness(1.04)}
.brandmark{display:inline-flex;align-items:center;gap:9px;font-weight:850;letter-spacing:-.03em}
.brandmark i{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--brand);color:var(--on);font-style:normal}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.toolbar .f{flex:0 0 auto}
.metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:14px 0}
.metric{padding:15px}
.metric strong{display:block;font-size:1.8rem;line-height:1.2}
.metric small{color:var(--mute)}
.panel-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chart{width:100%;height:auto;max-height:240px}
.camera-frame{position:relative;overflow:hidden;border-radius:14px;background:#17252b;min-height:280px}
.camera-frame .snap{margin:0;width:100%;height:320px;object-fit:cover;opacity:.9}
.rec{position:absolute;top:14px;left:14px;background:#7c1d1d;color:white;border-radius:6px;padding:5px 9px;font:700 12px monospace;letter-spacing:.08em}
.rec:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#ff5555;margin-right:7px;animation:blink 1s infinite}
.scanline{position:absolute;left:0;right:0;height:2px;top:0;background:#55e0bd;box-shadow:0 0 12px #55e0bd;animation:scan 3.4s linear infinite}
.facebox{position:absolute;left:31%;top:22%;width:19%;height:40%;border:2px solid #f2c661;border-radius:8px;box-shadow:0 0 0 999px #0001}
.camlabel{position:absolute;left:31%;top:64%;color:#f2c661;font:12px monospace}
@keyframes blink{50%{opacity:.2}}@keyframes scan{to{top:100%}}
.live-row{animation:rowIn .35s ease;background:var(--okbg)}
@keyframes rowIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.audit-item{padding:11px 13px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.audit-item:last-child{border:0}
.audit-dot{width:9px;height:9px;border-radius:50%;background:var(--brand);margin-top:6px;flex:none}
.reason{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.office-nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.office-nav button.active{background:var(--brand);color:var(--on)}
.theme-toggle{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;min-height:40px;padding:0 12px;cursor:pointer}
.skeleton{height:14px;border-radius:8px;background:linear-gradient(90deg,var(--line),var(--card),var(--line));background-size:200% 100%;animation:shimmer 1.4s infinite}
@keyframes shimmer{to{background-position:-200% 0}}
@media(min-width:900px){
 .register-layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(340px,.9fr);gap:18px;align-items:start}
 .register-layout .list-column{grid-column:1}
 .register-layout .detail-column{grid-column:2;grid-row:1}
 .foot>div{max-width:1180px}
 .sheet{max-width:680px}
}
@media(max-width:700px){main{padding:12px 14px 110px}.metric-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.panel-grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>

 `<div class="metric-grid"><div class="card metric"><strong>${L.length}</strong><small>Отправлено журналов</small></div><div class="card metric"><strong>${pct}%</strong><small>Общая посещаемость</small></div><div class="card metric"><strong>${L.reduce((n,r)=>n+count(r.students,"ok"),0)}</strong><small>Вовремя</small></div><div class="card metric"><strong>${L.reduce((n,r)=>n+count(r.students,"abs"),0)}</strong><small>Отсутствуют</small></div></div>
 <div class="panel-grid"><div class="card lesson"><h2>Общая посещаемость</h2>${ring}</div><div class="card lesson"><h2>По отправленным группам</h2>${svgBars}</div></div>
 <div class="toolbar"><select class="search" id="officeGroup" style="max-width:260px" onchange="filterOffice()"><option value="">Все группы</option>${groups.map(g=>`<option>${esc(g)}</option>`).join("")}</select><input class="search" style="max-width:220px" type="date" id="officeDate" onchange="filterOffice()"><button class="f" onclick="downloadCSV()">Скачать CSV</button></div>
 <div class="card" id="officeRows">${L.length?L.map((r,i)=>`<div class="lesson"><div class="lrow"><b>${esc(r.cls)}</b><span class="st sent">${esc(r.date)} ${esc(r.at)}</span></div><p class="mute">Преподаватель: ${esc(r.by)}</p><div class="chips"><div class="chip ok">${count(r.students,"ok")}<small>Вовремя</small></div><div class="chip late">${count(r.students,"late")}<small>Опоздали</small></div><div class="chip abs">${count(r.students,"abs")}<small>Отсутствуют</small></div></div></div>`).join(""):`<p class="empty mute">Журналов пока нет — отправленные данные появятся здесь.</p>`}</div>`}`;
};
function filterOffice(){
 const group=document.getElementById("officeGroup")?.value||"",date=document.getElementById("officeDate")?.value||"";
 document.querySelectorAll("#officeRows .lesson").forEach(el=>{const txt=el.innerText;el.style.display=(!group||txt.includes(group))&&(!date||txt.includes(new Date(date+"T00:00:00").toLocaleDateString()))?"":"none"});
}
function downloadCSV(){
 const L=(()=>{try{return JSON.parse(localStorage.getItem("pc_sub")||"[]")}catch(e){return[]}})();
 const rows=[["Группа","Дата","Время","Преподаватель","Студент","Статус"]];
 L.forEach(r=>r.students.forEach(x=>rows.push([r.cls,r.date,r.at,r.by,x.name,x.status])));
 const csv="\uFEFF"+rows.map(r=>r.map(x=>'"'+String(x??"").replace(/"/g,'""')+'"').join(";")).join("\r\n");
 const url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));const a=document.createElement("a");a.href=url;a.download="presence-report.csv";a.click();URL.revokeObjectURL(url);
}

(async()=>{try{if(/logout/.test(location.search))localStorage.removeItem("pc_session");await seed();const e=localStorage.getItem("pc_session"),u=getUsers().find(x=>x.email===e);if(u)return login(u)}catch(e){}render()})();
</script></body></html>
